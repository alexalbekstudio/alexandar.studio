<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Alexandar Studio</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="../img/logo-a.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(ellipse at center, #0a1428 0%, #020308 70%);
      min-height: 100vh;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .glow {
      box-shadow: 0 0 60px -10px rgba(56, 189, 248, 0.3);
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .float { animation: float 6s ease-in-out infinite; }
  </style>
</head>
<body class="text-slate-200 flex items-center justify-center p-4">

  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="text-center mb-10 float">
      <img src="../img/logo-a.png" alt="A" class="h-16 mx-auto mb-3 drop-shadow-[0_0_16px_rgba(56,189,248,0.5)]">
      <h1 class="text-2xl font-extrabold text-white">Alexandar Studio</h1>
      <p class="text-xs mono text-cyan-400 tracking-[0.3em] mt-2">ADMIN ACCESS</p>
    </div>

    <!-- Forma -->
    <form id="loginForm" class="bg-slate-900/70 backdrop-blur-md border border-slate-800 rounded-2xl p-7 space-y-5 glow">

      <div>
        <label class="block text-[10px] mono text-slate-400 mb-2 tracking-widest">KORISNIČKO IME</label>
        <input type="text" id="username" required autocomplete="username" autofocus
          class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 focus:outline-none transition">
      </div>

      <div>
        <label class="block text-[10px] mono text-slate-400 mb-2 tracking-widest">LOZINKA</label>
        <div class="relative">
          <input type="password" id="password" required autocomplete="current-password"
            class="w-full px-4 py-3 pr-12 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 focus:outline-none transition">
          <button type="button" id="togglePwd"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-cyan-400 text-xs mono">
            👁
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-emerald-500 text-slate-950 font-bold text-sm hover:brightness-110 active:scale-[0.98] transition-all disabled:opacity-50 disabled:cursor-not-allowed">
        Prijavi se →
      </button>

      <p id="error" class="text-xs text-red-400 text-center hidden"></p>
    </form>

    <p class="text-center text-[10px] mono text-slate-600 mt-6">
      © 2026 alexandar.studio — Restricted Area
    </p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('submitBtn');
    const error = document.getElementById('error');

    // Toggle password visibility
    document.getElementById('togglePwd').addEventListener('click', () => {
      const p = document.getElementById('password');
      p.type = p.type === 'password' ? 'text' : 'password';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Provera...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });

        if (res.ok) {
          btn.textContent = '✓ Uspešno!';
          btn.className = 'w-full py-3.5 rounded-xl bg-emerald-500 text-slate-950 font-bold text-sm transition-all';
          setTimeout(() => window.location.href = '/admin/dashboard.html', 400);
        } else {
          const data = await res.json().catch(() => ({}));
          error.textContent = data.error || 'Pogrešno korisničko ime ili lozinka.';
          error.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Prijavi se →';
        }
      } catch (err) {
        error.textContent = 'Server nije dostupan. Proveri da li je pokrenut.';
        error.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Prijavi se →';
      }
    });
  </script>
</body>
</html>
